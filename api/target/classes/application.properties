spring.application.name=api

# URL de conexión a la base de datos (reemplaza 'tu_base_de_datos' por el nombre real)
spring.datasource.url=jdbc:mysql://localhost:3306/cremissimo?useSSL=false&serverTimezone=UTC

# Credenciales de acceso a MySQL
spring.datasource.username=root
spring.datasource.password=root

# Driver de conexión moderno para MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración opcional de Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.security.user.name=user
spring.security.user.password=password