spring.application.name=api

# MySQL local. Sobrescribe DB_URL, DB_USERNAME y DB_PASSWORD en otros entornos.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/cremissimo?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Flyway administra el esquema; Hibernate solo comprueba que las entidades coincidan.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=2
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# JWT: si no se define, se genera una clave aleatoria al iniciar la aplicación.
app.security.jwt.secret=${JWT_SECRET:}
app.security.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.security.cookie.name=${AUTH_COOKIE_NAME:auth_token}
app.security.cookie.secure=${AUTH_COOKIE_SECURE:false}
app.security.cookie.same-site=${AUTH_COOKIE_SAME_SITE:Lax}
# Orígenes permitidos para el frontend local. Separar varios orígenes con comas.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
